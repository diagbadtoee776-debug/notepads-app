publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^1.2.2
  shared_preferences: ^2.2.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  google_fonts: ^6.1.0
  record: ^5.1.2
